server:
  port: ${PORT:8081}

spring:
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:regimenudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2-console

spoonacular:
  api:
    base-url: https://api.spoonacular.com
    key: ${SPOONACULAR_API_KEY:}

jwt:
  secret: ${JWT_SECRET:RegiMenuSuperSecretKeyForJwtSignatureMustBeAtLeast256BitsLong2026!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
