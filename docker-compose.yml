services:
  db:
    image: postgres:16-alpine
    container_name: regimenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regimenu}
      POSTGRES_USER: ${POSTGRES_USER:-regimenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regimenu_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - regimenu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regimenu} -d ${POSTGRES_DB:-regimenu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regimenu-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-regimenu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-regimenu}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-regimenu_dev}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-RegiMenuSuperSecretKeyForJwtSignatureMustBeAtLeast256BitsLong2026!}

volumes:
  regimenu_pgdata:
